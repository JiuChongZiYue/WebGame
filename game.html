<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            WebGame
        </title>

        <style>
            .game-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        </style>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <h1>
            Try to Survive!
        </h1>




        <div class="game-container">

            <div class="game-area">

                <div>
                    Score: <span id="score">0</span>
                </div>

                <button id="pauseButton">Pause</button>

                <canvas
                    id="gameCanvas"
                    width="1000"
                    height="700">
                </canvas>

                 <div id="gameOverScreen" class="game-over-screen">
                    <h2>Game Over</h2>
                    <p>Score: <span id="finalScore">0</span></p>
                    <button id="restartButton">Restart</button>
                </div>

            </div>


            <div class="game-info">

                <h2>Game Info</h2>

                <div>
                    <strong>Health</strong>
                    <div>
                        <span id="health">100</span> / 100
                    </div>
                </div>

                <div>
                    <strong>Ammo</strong>
                    <div>
                        <span id="ammo">30</span> / 30
                    </div>
                </div>

                <div>
                    <strong>Enemies Killed</strong>
                    <div>
                        <span id="enemyCount">0</span>
                    </div>
                </div>

                <div>
                    <strong>Time</strong>
                    <div>
                        <span id="gameTime">0</span>
                    </div>
                </div>

            </div>

        </div>







        <script src="player.js"></script>
        <script src="supply.js"></script>
        <script src="enemy.js"></script>
        <script src="bullet.js"></script>
        <script src="game.js"></script>


        <!-- <h2>
            This is a game!
        </h2> -->
    </body>


</html>
